services:
  postgres:
    container_name: hookylog-postgres
    image: postgres:alpine
    environment:
      - POSTGRES_DB=hookylog
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    restart: unless-stopped
    volumes:
      - ./.docker/postgres:/var/lib/postgresql/data
